<!DOCTYPE html>
<html lang="zh-Hant">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Google Gemini 聊天機器人</title>
        <script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>
        <style>
            * {
                padding: 0;
                margin: 0;
                box-sizing: border-box;
            }
            body {
                font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                background-color: #f4f4f9;
                color: #333;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                padding: 1rem;
            }
            h1 {
                font-size: 2rem;
                color: #4a90e2;
                margin-bottom: 1rem;
            }
            #chatHistory {
                width: 100%;
                max-width: 600px;
                height: 60vh;
                overflow-y: auto;
                background-color: #ffffff;
                border-radius: 10px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                padding: 1rem;
            }
            #chatHistory > div {
                margin-bottom: 1rem;
            }
            .author {
                font-weight: bold;
            }
            .inputs {
                width: 100%;
                max-width: 600px;
                display: flex;
                gap: 0.5rem;
                margin-top: 1rem;
            }
            input,
            button {
                height: 2.5rem;
                border-radius: 5px;
                border: none;
                padding: 0.5rem;
            }
            input {
                flex-grow: 1;
                border: 1px solid #ccc;
            }
            button {
                background-color: #4a90e2;
                color: white;
                cursor: pointer;
            }
            button:hover {
                background-color: #357abd;
            }
        </style>
    </head>
    <body>
        <h1>Google Gemini 聊天機器人</h1>
        <div id="chatHistory">
            <!-- 聊天記錄將顯示在這裡 -->
        </div>
        <div class="inputs">
            <!-- API 金鑰輸入框 -->
            <input type="password" id="apiKey" placeholder="API Key" />
            
            <!-- 用戶訊息輸入框 -->
            <input
                type="text"
                id="messageInput"
                placeholder="輸入您的訊息..."
            />
            
            <!-- 發送按鈕 -->
            <button onclick="sendMessage()">發送</button>
        </div>
        <script>
            // 初始化 Markdown 格式轉換器
            const converter = new showdown.Converter();

            // 儲存對話記錄的陣列
            let thread = [];
            
            // 發送訊息函式
            function sendMessage() {
                
                // 獲取 API 金鑰和用戶輸入的訊息
                const apiKey = document.getElementById("apiKey").value.trim();
                const message = document.getElementById("messageInput").value.trim();

                // 驗證輸入是否完整
                if (!apiKey || !message) {
                    alert("請輸入 API Key 和訊息！");
                    return; // 如果未填寫，則中止操作
                }

                // 顯示用戶訊息在聊天記錄中
                document.getElementById("chatHistory").innerHTML +=
                    `<div><div class='author'>你:</div>${message}</div>`;
                
                // 將用戶訊息加入對話記錄
                thread.push({
                    role: "user", // 表示角色為用戶
                    parts: [{ text: message }], // 用戶的訊息內容
                });

                // 呼叫 Google Gemini API 發送請求
                fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${apiKey}`,
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ contents: thread }), // 傳遞對話記錄作為請求內容
                    }
                )
                    .then(response => response.json()) // 將回應轉換為 JSON 格式
                    .then(data => {
                        // 獲取機器人的回應內容，如果無回應則顯示錯誤提示
                        const msg = data.candidates[0]?.content?.parts[0]?.text || "無回應，請檢查 API Key 或訊息格式。";
                        
                        // 顯示機器人回應在聊天記錄中
                        document.getElementById("chatHistory").innerHTML +=
                            `<div><div class='author'>機器人:</div>${converter.makeHtml(msg)}</div>`;
                        
                        // 將機器人回應加入對話記錄
                        thread.push({
                            role: "model", // 表示角色為機器人
                            parts: [{ text: msg }], // 機器人的回應內容
                        });

                        // 自動滾動至聊天記錄底部
                        const chatHistory = document.getElementById("chatHistory");
                        chatHistory.scrollTop = chatHistory.scrollHeight;

                        // 清空用戶輸入框以便輸入新訊息
                        document.getElementById("messageInput").value = "";
                    })
                    .catch(error => {
                        console.error("Error:", error); // 在控制台顯示錯誤資訊

                        // 顯示錯誤訊息在聊天記錄中
                        document.getElementById("chatHistory").innerHTML +=
                            `<div><div class='author'>機器人:</div>錯誤：${error.message}</div>`;
                    });
            }
        </script>
    </body>
</html>
